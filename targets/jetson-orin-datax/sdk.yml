################################################################################
# DataX — ADIS16470 IMU on NVIDIA AGX Orin  (custom JetPack 7.2.1 / L4T r39.2.1)
#
# An OS-IMAGE build (like the `kuiper` target): CiM orchestrates fetch + workspace
# + make targets, and the real build is the NVIDIA L4T BSP flow driven by our
# effort repo (=y ADIS16475 driver + baked DT node + MB1 pinmux, then flash).
#
# Effort repo : https://github.com/Carlosjr-Jones_adi/datax-orin
# Host prereqs: Linux/WSL2 x86_64, ~40 GB disk, sudo, qemu-user-static + binfmt.
#               (Cross-build is x86_64-host → aarch64; not an aarch64-host build.)
#
# ⚠ FIRST-CUT DRAFT — validate with `cim makefile` then inspect the generated
#   Makefile before `make`. Likely iteration points are marked  TODO / NOTE.
#   In Make recipes: CiM expands ${{ VAR }} → $(VAR); shell vars need $$ .
################################################################################

variables:
  # Resolved relative to the CiM workspace root ( ${{ WORKSPACE }} = ~/dsdk-jetson-orin-datax ).
  L4T_DIR:   ${{ WORKSPACE }}/Linux_for_Tegra
  TOOLCHAIN: ${{ WORKSPACE }}/x-tools/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-
  BUILDER:   ${{ WORKSPACE }}/datax-orin/datax-image-builder
  BOARD:     jetson-agx-orin-devkit

################################################################################
# Cross toolchain — crosstool-NG 1.26.0 gcc 13.2.0 (aarch64-none-linux-gnu-).
# Shipped in the L4T r38 release, reused for r39 (same as bootstrap.sh).
#
# NOT handled via `toolchains:` — CiM's toolchain extractor (toolchain_manager.rs
# extract_archive) only supports .tar.xz/.txz, .tar.gz/.tgz, .tar, .zip; it has
# NO bzip2 branch, so `x-tools.tbz2` fails with "Unsupported archive format".
# A toolchain's `name` drives URL + cache + format detection at once, so there is
# no name that both downloads as .tbz2 AND extracts. Instead we fetch it as a
# plain `copy_files` download (below) and untar it in the `stage-toolchain`
# install step with `tar xf` (which auto-detects bzip2). Also note the archive
# root is `./x-tools/`, so strip-components must be 2 (not 1) to land the compiler
# at ${{ TOOLCHAIN }}.  [savepoint: cim bzip2-toolchain limitation]
################################################################################

################################################################################
# Downloads — CiM fetches + caches them at `cim init` (pin sha256 for repro).
# BSP archives are extracted in `stage-bsp`; x-tools in `stage-toolchain`.
################################################################################
copy_files:
  - source: https://developer.nvidia.com/downloads/embedded/L4T/r38_Release_v2.0/release/x-tools.tbz2
    dest: downloads/x-tools.tbz2
    cache: true
    # sha256: <TODO>
  - source: https://developer.nvidia.com/downloads/embedded/L4T/r39_Release_v2.1/release/Jetson_Linux_R39.2.1_aarch64.tbz2
    dest: downloads/Jetson_Linux_R39.2.1_aarch64.tbz2
    cache: true
    # sha256: <TODO>
  - source: https://developer.nvidia.com/downloads/embedded/L4T/r39_Release_v2.1/release/Tegra_Linux_Sample-Root-Filesystem_R39.2.1_aarch64.tbz2
    dest: downloads/Tegra_Linux_Sample-Root-Filesystem_R39.2.1_aarch64.tbz2
    cache: true
    # sha256: <TODO>
  - source: https://developer.nvidia.com/downloads/embedded/L4T/r39_Release_v2.1/sources/public_sources.tbz2
    dest: downloads/public_sources.tbz2
    cache: true
    # sha256: <TODO>

################################################################################
# Git — our effort repo (patches + build scripts). PIN to a commit SHA.
################################################################################
gits:
  - name: datax-orin
    url: https://github.com/Carlosjr-Jones_adi/datax-orin.git
    commit: 2f758f118d9682e2227fcb8fc518ae21d2d7b8db   # datax-orin master @ 2026-10-14 (docs: docker/dialout first-boot gap + RTC cold-boot gotcha)

################################################################################
# Install steps (idempotent via sentinels) → `make install-<name>`.
#   stage-toolchain      — untar x-tools (bzip2) → ${{ TOOLCHAIN }}         (replaces `cim install toolchains`)
#   stage-bsp            — extract BSP + rootfs + sources, apply_binaries  (L4T Stages A+B)
#   integrate-adis16470  — apply the device patches                        (per-device; add more later)
################################################################################
install:
  - name: stage-toolchain
    sentinel: true
    # x-tools.tbz2 is bzip2; CiM's toolchain extractor can't read it, so we untar
    # it here (`tar xf` auto-detects bzip2). Archive root is `./x-tools/` → strip 2.
    commands: |
      [ -x "${{ TOOLCHAIN }}gcc" ] || { mkdir -p "${{ WORKSPACE }}/x-tools" && tar xf "${{ WORKSPACE }}/downloads/x-tools.tbz2" -C "${{ WORKSPACE }}/x-tools" --strip-components=2; }
      echo "✓ toolchain staged (crosstool-NG gcc 13.2.0) → ${{ WORKSPACE }}/x-tools"

  - name: stage-bsp
    sentinel: .cim/.bsp-staged
    # NOTE: no leading `@` here — CiM folds `install:` commands into one `if/then/else`
    # shell block joined by ` && `, so a leading `@` would become a literal shell token
    # (`@[`, `@cd`) and fail. (`@` is only a Make silence prefix on phase-target recipe
    # lines below, where CiM emits each line as its own recipe line.)
    commands: |
      [ -d "${{ WORKSPACE }}/Linux_for_Tegra" ] || tar xf "${{ WORKSPACE }}/downloads/Jetson_Linux_R39.2.1_aarch64.tbz2" -C "${{ WORKSPACE }}"
      [ -e "${{ WORKSPACE }}/Linux_for_Tegra/rootfs/etc" ] || sudo tar xpf "${{ WORKSPACE }}/downloads/Tegra_Linux_Sample-Root-Filesystem_R39.2.1_aarch64.tbz2" -C "${{ WORKSPACE }}/Linux_for_Tegra/rootfs/"
      cd "${{ WORKSPACE }}/Linux_for_Tegra" && sudo ./tools/l4t_flash_prerequisites.sh || true
      cd "${{ WORKSPACE }}/Linux_for_Tegra" && sudo ./apply_binaries.sh
      [ -d "${{ WORKSPACE }}/Linux_for_Tegra/source/kernel/kernel-noble" ] || tar xf "${{ WORKSPACE }}/downloads/public_sources.tbz2" -C "${{ WORKSPACE }}"
      [ -d "${{ WORKSPACE }}/Linux_for_Tegra/source/kernel/kernel-noble" ] || ( cd "${{ WORKSPACE }}/Linux_for_Tegra/source" && tar xf kernel_src.tbz2 && tar xf kernel_oot_modules_src.tbz2 )
      echo "✓ BSP staged (Stages A+B) at ${{ L4T_DIR }}"

  - name: integrate-adis16470
    sentinel: .cim/.adis16470-integrated
    depends_on:
      - stage-bsp
    # NOTE: no leading `@` — see stage-bsp above (install commands are folded into a shell block).
    commands: |
      cd "${{ BUILDER }}" && L4T_DIR="${{ L4T_DIR }}" TOOLCHAIN="${{ TOOLCHAIN }}" bash -c '. ./env.sh && ./apply-changes.sh'
      echo "✓ ADIS16470 patches applied (defconfig =y, DT imu@0, MB1 pinmux+gpio, nv-platform spidev evict)"

################################################################################
# Phase targets → generated Makefile: make sdk-build / sdk-test / sdk-flash / …
################################################################################
envsetup:
  commands: |
    @echo "=========================================================="
    @echo "DataX — ADIS16470 on AGX Orin  (JetPack 7.2.1 / L4T r39.2.1)"
    @echo "=========================================================="
    @echo "Order of operations:"
    @echo "  cim install os-deps            # host build deps (apt)"
    @echo "  make install-stage-toolchain   # untar x-tools (bzip2) → TOOLCHAIN"
    @echo "  make install-stage-bsp         # extract BSP+rootfs+sources (sudo)"
    @echo "  make install-integrate-adis16470   # apply device patches"
    @echo "  make sdk-build                 # kernel + OOT modules + -nv.dtb + rootfs"
    @echo "  make sdk-test                  # verify-gates.sh"
    @echo "  make sdk-flash                 # flash the Orin (see notes)"

build:
  depends_on:
    - install-stage-toolchain
    - install-integrate-adis16470
  commands: |
    @echo "Building custom JetPack image (kernel + OOT modules + -nv.dtb) — this takes a while…"
    @cd "${{ BUILDER }}" && L4T_DIR="${{ L4T_DIR }}" TOOLCHAIN="${{ TOOLCHAIN }}" bash -c '. ./env.sh && ( cd "$$L4T_DIR/source" && ./nvbuild.sh ) && ./install.sh && ./install-userspace.sh'

test:
  commands: |
    @cd "${{ BUILDER }}" && L4T_DIR="${{ L4T_DIR }}" TOOLCHAIN="${{ TOOLCHAIN }}" bash -c '. ./env.sh && ./verify-gates.sh'

flash:
  commands: |
    @echo "Flash the Orin (native host, or WSL2 with usbipd --auto-attach):"
    @echo "  WSL2 only:   sudo systemctl restart systemd-binfmt.service   # else nv-update-initrd: Exec format error"
    @echo "  Recovery:    put Orin in Force Recovery; usbipd attach --wsl --auto-attach --busid <id>; lsusb | grep 0955"
    @echo "  Flash eMMC:  cd ${{ L4T_DIR }} && sudo ./flash.sh ${{ BOARD }} internal     # no --erase-all in r39.2.1"
    @echo "  Verify:      ls /sys/bus/iio/devices ; sudo dmesg | grep -i adis"

clean:
  commands: |
    @echo "Cleaning build outputs (keeps the downloads cache + staged BSP)…"
    @rm -rf "${{ L4T_DIR }}/source/kernel_out" || true
